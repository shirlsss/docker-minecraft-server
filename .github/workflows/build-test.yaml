# Execute docker build on image to test that image actually successfully builds
name: ShellCheck, Docker hadolint, Docker build/push

permissions:
  contents: read
  packages: write

on:
  push: 
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:

    # Check that Dockerfile syntax is correct and structure follows best-practices
      - name: Checkout repo code
        uses: actions/checkout@v4
      - name: Run run Hadolint GHActions Wraper
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

    # ShellCheck that syntax is error-free in bash scripts
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run ShellCheck wrapper
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error

    # Check that Docker image builds successfully then push to GHCR
    # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

    # Login to GitHub Container Registry (GHCR)
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    # Build and push
      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          tags: ghcr.io/${{ github.repository_owner }}/docker-minecraft-server:latest
